name: CI
on:
  push:
    branches: [incarnation]
  pull_request:
    branches: [incarnation]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy-url: ${{ steps.pages.outputs.url }}
    steps:
      - uses: nschloe/action-cached-lfs-checkout@1c185ad576953eab13e35ffe1bffef437d97e9d2 # v1

      - name: Astro build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: Restia image pipeline cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .cache/restia-images
          key: ${{ runner.os }}-restia-images-v1-${{ hashFiles('yarn.lock', 'src/util/images.ts', 'src/plugins/rehype-responsive-images.ts', 'src/components/ResponsiveImage.astro', 'public/photo/**', 'public/image/**') }}
          restore-keys: |
            ${{ runner.os }}-restia-images-v1-

      - name: Prepare Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          cache: true

      - name: Init deps
        run: yarn install

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - id: pages
        name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          directory: dist

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: nschloe/action-cached-lfs-checkout@1c185ad576953eab13e35ffe1bffef437d97e9d2 # v1

      - name: Prepare Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          cache: true

      - run: yarn install
      - run: yarn playwright install --with-deps
      - name: Run Playwright tests
        env:
          RESTIA_E2E_URL: ${{ needs.build.outputs.deploy-url }}
        run: yarn playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 20
