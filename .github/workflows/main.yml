name: CI
on:
  push:
    branches: [incarnation]
  pull_request:
    branches: [incarnation]

# New commits supersede older builds and deployments for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy-url: ${{ steps.pages.outputs.deployment-url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5

      - name: Astro build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: Restia image pipeline cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/restia-images
          key: ${{ runner.os }}-restia-images-v1-${{ hashFiles('yarn.lock', 'src/util/images.ts', 'src/plugins/rehype-responsive-images.ts', 'src/components/ResponsiveImage.astro', 'public/photo/**', 'public/image/**') }}
          restore-keys: |
            ${{ runner.os }}-restia-images-v1-

      - name: Prepare Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          cache: true

      - name: Init deps
        run: yarn install

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - id: pages
        name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.150.0'
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.deploy-url != ''
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5

      - name: Prepare Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          cache: true

      - run: yarn install
      - run: yarn playwright install --with-deps
      - name: Run Playwright tests
        env:
          RESTIA_E2E_URL: ${{ needs.build.outputs.deploy-url }}
        run: yarn playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 20
